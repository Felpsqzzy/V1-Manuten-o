<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIOTROP — Gestão Industrial</title>
<style>
:root{--b:#0d675b;--b2:#0a4e48;--bg:#071817;--panel:#0e2221;--line:#25413f;--txt:#eaf5f2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8f7;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}#app{width:100%;height:100%;border:0;display:block}
#live-clock{position:fixed;right:18px;bottom:18px;z-index:999999;display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid rgba(13,103,91,.2);border-radius:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.12);font-weight:800;color:#17433e;pointer-events:none}.dot{width:8px;height:8px;border-radius:50%;background:#19a974;box-shadow:0 0 0 5px rgba(25,169,116,.13)}#live-clock b{font-variant-numeric:tabular-nums;font-size:14px}#live-clock small{font-weight:650;color:#6a7d79}
#profile-photo-input{display:none}.toast{position:fixed;right:18px;top:18px;z-index:1000000;max-width:380px;padding:13px 16px;border-radius:14px;background:#0d675b;color:#fff;box-shadow:0 15px 40px rgba(0,0,0,.2);font-size:13px;font-weight:700;opacity:0;transform:translateY(-8px);transition:.25s}.toast.show{opacity:1;transform:none}
</style></head><body>
<iframe id="app" src="frontend/app.html" title="BIOTROP Gestão Industrial"></iframe>
<div id="live-clock"><span class="dot"></span><div><b id="clock-time">--:--:--</b><small id="clock-date">carregando</small></div></div>
<input id="profile-photo-input" type="file" accept="image/*"><div id="toast" class="toast"></div>
<script>
const frame=document.getElementById('app');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),3200)}
function clock(){const d=new Date();document.getElementById('clock-time').textContent=d.toLocaleTimeString('pt-BR');document.getElementById('clock-date').textContent=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});} clock();setInterval(clock,1000);
const enhanceCSS=`:root{--surface:#fff;--surface-2:#f5f8f7;--line:#dce9e5;--text:#17332b;--muted:#687a75;--brand:#0d675b;--brand-strong:#084d46;--brand-soft:#dff1ec}.body{transition:background .25s,color .25s}.v12-float{z-index:9999!important}.v12-float button{border-radius:12px!important;border:1px solid var(--line)!important;box-shadow:0 8px 22px rgba(0,0,0,.08)!important;font-weight:800!important;transition:.2s}.v12-float button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,0,0,.13)!important}.training-dialog.v12-settings{max-width:760px!important;border:1px solid var(--line)!important;border-radius:24px!important;box-shadow:0 30px 90px rgba(0,0,0,.2)!important;padding:30px!important}.v12-settings h2{font-size:28px!important;letter-spacing:-.04em}.v12-settings .training-label{font-weight:800}.v12-settings input,.v12-settings select{border-radius:12px!important;min-height:44px!important;border:1px solid var(--line)!important}.v12-settings .modal-actions{margin-top:20px}body.v12-dark{background:#071817!important;color:#eaf5f2!important}body.v12-dark .main-area,body.v12-dark .table-card,body.v12-dark .home-card,body.v12-dark .sci-card,body.v12-dark .scm-item-card,body.v12-dark .utility-card,body.v12-dark .training-card,body.v12-dark .training-dialog{background:#0d211f!important;border-color:#25413f!important;color:#eaf5f2!important}body.v12-dark input,body.v12-dark select,body.v12-dark textarea{background:#0a1b1a!important;color:#eaf5f2!important;border-color:#31504d!important}body.v12-dark .v12-float button{background:#102725!important;color:#dff1ec!important;border-color:#31504d!important}body.v12-dark h1,body.v12-dark h2,body.v12-dark h3{color:#eaf5f2!important}.industrial-chart{position:relative;overflow:hidden}.industrial-chart-line span{transition:height .6s cubic-bezier(.2,.8,.2,1),opacity .25s!important}.industrial-chart:after{content:'Atualização automática';position:absolute;right:4px;top:2px;font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase}.profile-photo-enhanced{width:38px!important;height:38px!important;border-radius:50%!important;object-fit:cover!important;border:2px solid #fff!important;box-shadow:0 4px 14px rgba(0,0,0,.14)!important}`;
function inject(){try{const d=frame.contentDocument;if(!d||d.getElementById('biotrop-enhance-css'))return;const s=d.createElement('style');s.id='biotrop-enhance-css';s.textContent=enhanceCSS;d.head.appendChild(s);setupProfile(d);setupLiveCharts(d);const old=d.getElementById('v12-theme');if(old){old.innerHTML='◐ Modo';old.title='Alternar modo claro/escuro'}}catch(e){}}
function setupProfile(d){const av=d.querySelector('.user-avatar');if(!av)return;const user=d.defaultView.STATE?.currentUser;const key='biotrop_profile_photo_'+(user?.dbId||'current');const saved=localStorage.getItem(key);if(saved){av.style.backgroundImage='url('+saved+')';av.style.backgroundSize='cover';av.style.backgroundPosition='center';av.textContent='';av.classList.add('profile-photo-enhanced')}av.style.cursor='pointer';av.title='Clique para alterar sua foto';av.onclick=()=>document.getElementById('profile-photo-input').click()}
document.getElementById('profile-photo-input').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>3*1024*1024){toast('Escolha uma foto de até 3 MB.');return}const r=new FileReader();r.onload=()=>{try{const d=frame.contentDocument;const av=d.querySelector('.user-avatar');if(av){av.style.backgroundImage='url('+r.result+')';av.style.backgroundSize='cover';av.style.backgroundPosition='center';av.textContent='';av.classList.add('profile-photo-enhanced')}const user=d.defaultView.STATE?.currentUser;localStorage.setItem('biotrop_profile_photo_'+(user?.dbId||'current'),r.result);toast('Foto de perfil atualizada.')}catch(err){toast('Não foi possível atualizar a foto.')}};r.readAsDataURL(f);e.target.value=''});
function setupLiveCharts(d){const key='BIOTROP_UTILITY_READINGS_V9';function redraw(){try{const readings=JSON.parse(d.defaultView.localStorage.getItem(key)||'[]');const nums=readings.map(x=>Number(x.reading)).filter(Number.isFinite);const chart=d.querySelector('.industrial-chart-line');if(!chart||!nums.length)return;const last=nums.slice(-10);const min=Math.min(...last),max=Math.max(...last),span=(max-min)||1;[...chart.children].forEach((el,i)=>{const v=last[Math.max(0,last.length-chart.children.length+i)]??last[last.length-1];el.style.height=(18+((v-min)/span)*72)+'%';el.title='Leitura: '+v});}catch(e){}}redraw();setInterval(redraw,3000);new MutationObserver(redraw).observe(d.body,{childList:true,subtree:true})}
frame.addEventListener('load',()=>{setTimeout(inject,150);setTimeout(inject,1000);setTimeout(inject,3000)});
</script></body></html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#003c41">
  <title>BIOTROP — Gestão Industrial</title>
</head>
<body style="margin:0;background:#003c41">
  <div id="boot" style="min-height:100vh;display:grid;place-items:center;background:#003c41;color:#fff;font:600 14px system-ui">Carregando BIOTROP — Control Room…</div>
  <script>
  (async function(){
    const boot=document.getElementById('boot');
    try{
      const res=await fetch('./app.html?nocache='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status+' ao carregar app.html');
      let html=await res.text();
      const extras='\n<link rel="stylesheet" href="/assets/css/biotrop-enhancements.css" data-biotrop-enhancements-css>\n<script src="/assets/js/biotrop-enhancements.js" defer data-biotrop-enhancements-js><\/script>\n<script src="/assets/js/scm-approval-fix.js" defer data-biotrop-scm-js><\/script>\n';
      if(html.toLowerCase().includes('</head>')) html=html.replace(/<\/head>/i,extras+'</head>');
      else html=extras+html;
      document.open();
      document.write(html);
      document.close();
    }catch(err){
      boot.innerHTML='<div style="max-width:720px;padding:24px;text-align:center"><h2 style="margin:0 0 8px">BIOTROP não conseguiu carregar</h2><p style="opacity:.8">'+String(err.message||err)+'</p><button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:10px;cursor:pointer">Tentar novamente</button></div>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
